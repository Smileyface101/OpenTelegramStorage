services:
  app:
    build: .
    image: opentelegramstorage:latest
    restart: unless-stopped
    ports:
      - "${OTS_PORT:-8080}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - OTS_DATA_DIR=/data
    volumes:
      - ots-data:/data
    # Uncomment to stage uploads on a specific disk instead of the named volume:
    #  - /mnt/big-disk/ots:/data

volumes:
  ots-data:
