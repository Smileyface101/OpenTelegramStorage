services:
  app:
    build: .
    image: opentelegramhosting:latest
    restart: unless-stopped
    ports:
      - "${OTG_PORT:-8080}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - OTG_DATA_DIR=/data
    volumes:
      - otg-data:/data
    # Uncomment to stage uploads on a specific disk instead of the named volume:
    #  - /mnt/big-disk/otg:/data

volumes:
  otg-data:
