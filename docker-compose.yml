services:
  app:
    # Prebuilt image from GitHub Container Registry. `docker compose up --build`
    # builds from this checkout instead.
    image: ghcr.io/smileyface101/opentelegramstorage:latest
    build: .
    restart: unless-stopped
    ports:
      - "${OTS_PORT:-8080}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - OTS_DATA_DIR=/data
    volumes:
      - ots-data:/data
      # Server-side import: anything under this host directory can be sent to
      # the channel from Settings/Upload -> "Import from server" without going
      # through a browser (read in place, never deleted). Read-only is enough.
      #- /mnt/media:/import:ro
    # Uncomment to stage uploads on a specific disk instead of the named volume:
    #  - /mnt/big-disk/ots:/data

volumes:
  ots-data:
